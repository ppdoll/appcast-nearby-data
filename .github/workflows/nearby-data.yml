# AppCast 주변 정보: 공공데이터포털의 전국 전기차 충전소·휴게소를 모아 GitHub Pages(v1/)로 게시한다.
#
# - 인증키는 저장소 시크릿 DATA_GO_KR_SERVICE_KEY 에만 둔다. 시크릿은 「수집」 단계에만 넘긴다.
# - 시크릿을 쓰는 collect 잡은 이 저장소의 dist/ 를 node 로 돌릴 뿐, npm 패키지를 설치하지 않는다.
# - 권한은 잡마다 필요한 만큼만 준다. 게시 권한(pages·id-token)은 시크릿이 없는 deploy 잡에만 있다.
# - 액션은 커밋 SHA 로 고정했다(주석이 버전). 올릴 때는 SHA 와 주석을 함께 바꾼다.
# - 상태(호출 예산·충전소 목록)는 actions/cache 로 실행 사이에 넘긴다. 수집이 실패해도 저장해 쓴 예산을 남긴다.
name: nearby-data

on:
  schedule:
    # 5분마다, 정각 혼잡을 피해 4분부터. 예약 실행은 cron 을 마지막으로 바꾼 커밋의 계정(저장소 주인 ppdoll)으로 돈다
    - cron: '4,9,14,19,24,29,34,39,44,49,54,59 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'auto: 규칙대로 / full: 전국 목록 다시 받기 / status: 상태 변경분만'
        type: choice
        options: [auto, full, status]
        default: auto

permissions: {}

concurrency:
  group: nearby-data
  cancel-in-progress: false # 전체 갱신(수 분)이 겹치지 않게 차례로 돈다

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30 # 전체 갱신은 시도 19곳·약 70쪽에, 504 가 나면 최대 85초씩 기다렸다 다시 부른다
    permissions:
      contents: read
      actions: write # 오래된 상태 캐시 지우기
    outputs:
      publish: ${{ steps.site.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: 지난 상태 복원
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: state
          key: nearby-state-${{ github.run_id }}
          restore-keys: nearby-state-

      - name: 수집
        run: node dist/main.js --state state --out site --mode "$MODE"
        env:
          MODE: ${{ inputs.mode || 'auto' }}
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}

      - name: 상태 저장
        if: always() && hashFiles('state/ledger.json') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: state
          key: nearby-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: 오래된 상태 캐시 지우기 (최근 5개만 둔다)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh cache list --key nearby-state- --sort created_at --order desc --limit 100 --json id --jq '.[5:][].id' |
            while read -r id; do gh cache delete "$id"; done

      - name: 게시할 것이 있는지
        id: site
        if: ${{ !cancelled() }}
        run: |
          if [ -f site/v1/meta.json ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Pages 아티팩트 올리기
        if: ${{ !cancelled() && steps.site.outputs.publish == 'true' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: collect
    # 수집이 문제를 알렸어도(예: 휴게소만 받지 못함) 검사를 통과한 사이트를 만들었으면 게시한다
    if: ${{ !cancelled() && needs.collect.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
